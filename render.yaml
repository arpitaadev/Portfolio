# Render "Blueprint": tells Render how to run this project as ONE web service.
# The Python server also serves the built website, so nothing else is needed.
services:
  - type: web
    name: arpita-portfolio
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
